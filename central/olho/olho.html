<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070914">
<title>Olho de Deus</title>
<style>
/* Olho de Deus (09/11/2026): globo com dado público do mundo em camadas. A cena é a do Andar 47 e da TV:
   tinta noite, letreiro em Jersey 15, texto em Archivo, fio em vez de caixa, raio 0, sem sombra. */
@font-face{font-family:"Jersey 15";src:url("../jersey15.woff2") format("woff2");font-display:swap}
:root{--noite:#070914;--sup:#10122a;--fio:#36346a;--borda:#4a4a86;--giz:#e6e8f6;--cinza:#a3abd4;--ciano:#5ff2f0;--ambar:#ffc85a;
  --display:"Jersey 15","Archivo",system-ui,sans-serif;--body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--noite);color:var(--giz);font:400 15px/1.45 var(--body);overflow:hidden}
button,input{font:inherit;color:inherit}
#palco{position:fixed;inset:0}
#globo{display:block;width:100%;height:100%;cursor:grab}
.topo{position:fixed;left:max(20px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));max-width:min(420px,calc(100vw - 40px));pointer-events:none}
h1{font:400 44px/0.95 var(--display);letter-spacing:.04em;margin:0}
.topo p{margin:6px 0 0;color:var(--cinza);font-size:14px}
.bt{min-height:44px;min-width:44px;padding:0 14px;background:rgba(7,9,20,.82);border:2px solid var(--borda);color:var(--giz);font:700 14px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.bt[aria-pressed="true"]{background:var(--giz);border-color:var(--giz);color:var(--noite)}
.bt:focus-visible,input:focus-visible,#globo:focus-visible{outline:3px solid var(--giz);outline-offset:3px}
@media (hover:hover){ .bt:hover{border-color:var(--giz)} }
.lado{position:fixed;right:max(20px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));bottom:max(16px,env(safe-area-inset-bottom));width:300px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;pointer-events:none}
.lado > *{pointer-events:auto}
.busca{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.busca input{min-height:44px;padding:0 12px;background:rgba(7,9,20,.82);border:2px solid var(--borda);font-size:16px;width:100%}
.busca input::placeholder{color:var(--cinza)}
.camadas{overflow:auto;background:rgba(7,9,20,.82);border-left:2px solid var(--fio);padding:4px 0 12px 16px;display:grid;gap:14px;align-content:start}
.camadas h2{font:400 26px/1 var(--display);letter-spacing:.04em;margin:8px 0 0}
.camadas h3{font:600 13px var(--body);letter-spacing:.08em;color:var(--cinza);margin:0 0 6px;text-transform:uppercase}
.grupo{display:grid;gap:6px}
.cam{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;min-height:44px;padding:0 10px 0 0;background:none;border:0;border-left:3px solid var(--fio);padding-left:10px;text-align:left;cursor:pointer;color:var(--cinza);width:100%}
.cam i{width:12px;height:12px;display:block;border:2px solid currentColor}
.cam b{font:600 15px var(--body)}
.cam span{font:600 14px var(--body);font-variant-numeric:tabular-nums}
.cam[aria-pressed="true"]{color:var(--giz);border-left-color:var(--c,var(--ciano))}
.cam[aria-pressed="true"] i{background:var(--c,var(--ciano));border-color:var(--c,var(--ciano))}
.cam:focus-visible{outline:3px solid var(--giz);outline-offset:-3px}
.cam small{grid-column:2 / -1;font-size:12px;color:var(--ambar);margin-top:-8px;padding-bottom:6px}
.regua{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--cinza);padding-left:13px}
.regua span{display:inline-flex;align-items:center;gap:5px}
.regua i{width:10px;height:10px;border-radius:50%;border:2px solid var(--c)}
.pe{position:fixed;left:max(20px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));right:340px;display:grid;gap:10px;justify-items:start;pointer-events:none}
.pe > *{pointer-events:auto}
.acoes{display:flex;flex-wrap:wrap;gap:8px}
#cartao{max-width:460px;background:rgba(7,9,20,.9);border-left:3px solid var(--ciano);padding:10px 14px}
#cartao b{display:block;font:600 16px/1.3 var(--body)}
#cartao span{display:block;color:var(--cinza);font-size:14px}
#conta{margin:0;color:var(--cinza);font-size:13px;max-width:70ch}
#aviso{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(440px,calc(100vw - 40px));background:rgba(7,9,20,.94);border-left:3px solid var(--ambar);padding:14px 16px;margin:0}
#abrir-camadas{display:none}
[hidden]{display:none!important}
/* banca (09/11): o globo se centra no espaço que sobra ao lado do painel, não na janela inteira */
@media (min-width:821px){ #palco{right:340px} }
/* texto por cima do mapa ganha uma placa de tinta noite do tamanho dele */
.topo{width:max-content;background:rgba(7,9,20,.82);padding:8px 12px 10px;margin:-8px 0 0 -12px}      /* uma placa só pro título e a data */
#conta{width:max-content;max-width:100%;background:rgba(7,9,20,.82);box-shadow:0 0 0 6px rgba(7,9,20,.82)}
.regua > span:first-child{flex-basis:100%}      /* "magnitude" numa linha, as quatro faixas na outra */
/* a legenda usa a forma que aparece no mapa */
.cam svg{width:18px;height:18px;display:block;color:var(--c,var(--ciano));flex:none}
.cam[aria-pressed="false"] svg{color:var(--cinza);opacity:.6}
.cam[aria-pressed="true"]{border-left-color:var(--giz)}
@media (max-width:820px){
  h1{font-size:34px}
  /* celular: as camadas viram uma folha que sobe de baixo, opaca, e para em cima da fileira de botões (uma linha só) */
  .lado{left:0;right:0;width:auto;top:auto;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 56px);grid-template-rows:auto minmax(0,1fr);gap:0;max-height:min(66vh,calc(100dvh - 190px))}
  .lado.aberta{background:var(--noite);border-top:2px solid var(--giz);padding:12px 16px 0}
  .lado .camadas{border-left:0;background:none;padding:4px 0 12px;margin-top:8px}
  .lado .busca input{background:var(--sup)}
  .lado:not(.aberta){display:none}
  .pe{right:16px;left:16px}
  /* embaixo ficam três botões do mesmo tamanho; o zoom sobe pra beira direita, um em cima do outro */
  .acoes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
  .acoes .bt{padding:0 6px;min-width:0}
  .acoes #menos,.acoes #mais{position:fixed;right:max(16px,env(safe-area-inset-right));width:44px;padding:0}
  .acoes #mais{bottom:calc(max(16px,env(safe-area-inset-bottom)) + 108px)}
  .acoes #menos{bottom:calc(max(16px,env(safe-area-inset-bottom)) + 56px)}
  /* folha de camadas aberta: ocupa a metade de baixo e o globo sobe pra metade de cima, pra ele ver o efeito */
  .lado{max-height:46dvh}
  body.camadas-abertas #palco{bottom:calc(46dvh + 68px)}
  body.camadas-abertas .acoes #menos,body.camadas-abertas .acoes #mais,body.camadas-abertas .topo p{display:none}
  #abrir-camadas{display:inline-flex}
  #conta{display:none}
  .lado.aberta ~ .pe #cartao{display:none}
}
#busca-msg{grid-column:1 / -1;margin:0;padding:8px 10px;background:rgba(7,9,20,.92);border-left:3px solid var(--ambar);font-size:14px}
@media (max-width:820px){ #cartao{margin-right:60px}      /* não passa por baixo do + e do − */
  .acoes{max-width:420px} .acoes #menos,.acoes #mais{background:var(--noite)}
  .lado{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 64px)}
  .lado.aberta .camadas{padding-bottom:40px;-webkit-mask-image:linear-gradient(#000 calc(100% - 44px),transparent);mask-image:linear-gradient(#000 calc(100% - 44px),transparent)} }
@media (max-width:360px){ .acoes{gap:6px} .acoes .bt{font-size:13px;padding:0 4px} h1{font-size:30px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
body.embutido h1{font-size:34px}
</style>
</head>
<body>
<div id="palco"><canvas id="globo" tabindex="0" role="img" aria-label="Globo da Terra com as camadas ligadas. Arraste pra girar, use a roda ou a pinça pra aproximar."></canvas></div>
<header class="topo">
  <h1>Olho de Deus</h1>
  <p id="quando">Carregando o dado do mundo…</p>
</header>
<aside class="lado" id="lado" aria-label="Camadas e busca">
  <form class="busca" id="busca" autocomplete="off">
    <input id="q" list="cidades" placeholder="Cidade ou lat, lon" aria-label="Buscar cidade, ou latitude e longitude">
    <button class="bt" type="submit">Ir</button>
    <datalist id="cidades"></datalist>
    <p id="busca-msg" role="status" hidden></p>
  </form>
  <div class="camadas" id="camadas"></div>
</aside>
<div class="pe">
  <div id="cartao" hidden role="status"></div>
  <div class="acoes">
    <button class="bt" type="button" id="abrir-camadas" aria-expanded="false" aria-controls="lado">Camadas</button>
    <button class="bt" type="button" id="menos" aria-label="Afastar">−</button>
    <button class="bt" type="button" id="mais" aria-label="Aproximar">+</button>
    <button class="bt" type="button" id="brasil">Brasil</button>
    <button class="bt" type="button" id="girar" aria-pressed="true">Girando</button>
  </div>
  <p id="conta"></p>
</div>
<p id="aviso" hidden role="status"></p>
<script src="olho.js"></script>
<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const P = new URLSearchParams(location.search);
const EMBUTIDO = P.get("embutido") === "1";
if (EMBUTIDO) document.body.classList.add("embutido");
const calmo = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const guarda = { ler(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, gravar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const pref = Object.assign({ desligadas: [], girar: !calmo }, guarda.ler("olho-pref", {}));
const olho = Olho.criar($("globo"), { paises: "paises-110m.json", auto: pref.girar, fps: 30, parado: calmo });
for (const id of pref.desligadas) olho.camada(id, false);
const COR = { terremotos: "#ffc85a", queimadas: "#ff6a3c", eventos: "#ff5ad6", satelites: "#e6e8f6", lancamentos: "#b4f27a", avioes: "#8fb4ff" };
let D = null, falhas = 0;
const hora = (ts) => ts ? new Date(ts * 1000).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "";
const ha = (ts) => { if (!ts) return ""; const s = Math.max(0, Date.now() / 1000 - ts); return s < 3600 ? `há ${Math.max(1, Math.round(s / 60))} min` : s < 86400 ? `há ${Math.round(s / 3600)} h` : `há ${Math.round(s / 86400)} d`; };
const el = (tag, at = {}, ...f) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(at)) { if (v == null || v === false) continue; if (k === "text") e.textContent = v; else e.setAttribute(k, v === true ? "" : v); } for (const x of f.flat(4)) if (x != null) e.append(x); return e; };

/* a marca de cada camada na legenda é a mesma forma que o globo desenha */
const FORMAS = { terremotos: '<circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/>',
  queimadas: '<rect x="3" y="3" width="4" height="4" fill="currentColor"/><rect x="10" y="6" width="4" height="4" fill="currentColor"/><rect x="5" y="11" width="4" height="4" fill="currentColor"/>',
  eventos: '<path d="M9 3a6 6 0 0 1 5.6 3.9M9 15a6 6 0 0 1-5.6-3.9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="9" r="1.8" fill="currentColor"/>',
  satelites: '<path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="2"/>',
  lancamentos: '<path d="M9 16V7" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="5" r="3" fill="currentColor"/>',
  avioes: '<path d="M4 14 14 4" stroke="currentColor" stroke-width="2.4"/>' };
function forma(id) { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 18 18"); s.setAttribute("aria-hidden", "true"); s.innerHTML = FORMAS[id] || ""; return s; }

/* ---- camadas: liga e desliga, contagem, dado velho ---- */
function desenharCamadas() {
  const lig = olho.ligadas(), c = olho.contagens(), fontes = (D && D.fontes) || {};
  const noMapa = Olho.CAMADAS.filter((k) => lig[k.id]).length;
  const grupos = [...new Set(Olho.CAMADAS.map((k) => k.grupo))];
  $("camadas").replaceChildren(
    el("h2", { text: "Camadas" }), el("p", { style: "margin:-8px 0 0;color:var(--cinza);font-size:13px", text: `${noMapa} de ${Olho.CAMADAS.length} no mapa` }),
    ...grupos.map((g) => el("div", { class: "grupo" }, el("h3", { text: g }),
      Olho.CAMADAS.filter((k) => k.grupo === g).map((k) => {
        const f = fontes[k.id] || {}, velho = D && f.em && (!f.ok || Date.now() / 1000 - f.em > 3 * 3600);
        const b = el("button", { type: "button", class: "cam", "aria-pressed": String(!!lig[k.id]), style: `--c:${COR[k.id]}`, "aria-label": `${k.nome}, ${c[k.id] || 0} no dado. ${lig[k.id] ? "Desligar" : "Ligar"}` },
          forma(k.id), el("b", { text: k.nome }), el("span", { text: D ? String(c[k.id] || 0) : "" }),
          velho ? el("small", { text: `dado das ${hora(f.em)}: a fonte não respondeu depois` }) : (D && !f.em ? el("small", { text: "a fonte ainda não respondeu" }) : null));
        b.addEventListener("click", () => { const on = !olho.ligadas()[k.id]; olho.camada(k.id, on); pref.desligadas = Olho.CAMADAS.filter((x) => !olho.ligadas()[x.id]).map((x) => x.id); guarda.gravar("olho-pref", pref); desenharCamadas(); });
        // a régua de magnitude fica colada no terremoto, não no fim do grupo
        return k.id === "terremotos" ? [b, el("div", { class: "regua", "aria-label": "Cor do terremoto pela magnitude" }, el("span", { text: "magnitude" }), [["menos de 4", 3], ["4 a 5", 4], ["5 a 6", 5], ["6 ou mais", 6]].map(([t, m]) => el("span", {}, el("i", { style: `--c:${Olho.corMag(m)}` }), t)))] : b;
      }))));
  const maior = c.maior ? ` (o maior, ${String(c.maior).replace(".", ",")})` : "";
  $("conta").textContent = D ? `${c.terremotos} terremotos em 24 h${maior} · ${c.queimadas} focos de queimada · ${c.satelites} satélites · ${c.avioes} aviões sobre o Brasil · ${c.lancamentos} lançamentos marcados` : "";
}
function receber(d) {
  D = d; olho.dados(d); falhas = 0;
  $("aviso").hidden = true;
  const velho = d.atualizado && Date.now() / 1000 - d.atualizado > 1800;
  $("quando").textContent = d.atualizado ? `Dado público do mundo · atualizado às ${hora(d.atualizado)}${velho ? " (o coletor do PC parou; o que aparece é o último dado)" : ""}` : "O coletor do PC ainda não trouxe nada.";
  desenharCamadas();
}
function avisar(txt) { $("aviso").textContent = txt; $("aviso").hidden = false; }

/* ---- de onde vem o dado: no PC, do servidor da Central; embutido no celular, a Central manda por mensagem ---- */
const FONTE = P.get("dados") || "../olho/dados";
async function buscar() {
  if (P.get("dados") === "mensagem") return;
  try {
    const r = await fetch(FONTE, { cache: "no-store" });
    if (r.status === 503) { if (!D) avisar("O coletor do PC ainda não rodou. Em um minuto o dado aparece sozinho."); return; }
    if (!r.ok) throw new Error("http " + r.status);
    receber(await r.json());
  } catch (e) {
    if (++falhas >= 2) { if (D) $("quando").textContent = `Sem contato com o PC agora. Mostrando o dado das ${hora(D.atualizado)}; tento de novo sozinho.`; else avisar("Não consegui falar com o PC. O globo aparece assim que ele responder; tento de novo sozinho."); }
  }
}
addEventListener("message", (ev) => { if (ev.origin === location.origin && ev.data && ev.data.olho) receber(ev.data.olho); else if (ev.origin === location.origin && ev.data && ev.data.olhoAviso) avisar(ev.data.olhoAviso); });
if (P.get("dados") === "mensagem") { $("quando").textContent = "Esperando o dado da Central…"; parent.postMessage({ olhoPronto: true }, location.origin); }
buscar(); setInterval(() => { if (!document.hidden) buscar(); }, 60000);

/* ---- tocar num ponto ---- */
const VEL = (v) => v == null ? "" : `${Math.round(v * 3.6)} km/h`;
olho.aoEscolher((e) => {
  const c = $("cartao");
  if (!e) { c.hidden = true; return; }
  const i = e.item, linhas = {
    terremotos: () => [`Terremoto de magnitude ${String(i.mag).replace(".", ",")}`, [i.lugar, ha(i.ts), i.prof != null ? `${i.prof} km de profundidade` : ""]],
    eventos: () => [({ ciclone: "Ciclone", tempestade: "Tempestade", vulcao: "Vulcão", incendio: "Incêndio" }[i.tipo] || "Evento") + (i.nome ? ": " + i.nome : ""), [i.ts ? "visto " + ha(i.ts) : "", i.nivel ? "alerta " + i.nivel : ""]],
    satelites: () => [i.iss ? "Estação Espacial Internacional" : i.nome, [`${Math.round(i.alt)} km de altitude`, `sobre ${Math.abs(i.lat).toFixed(1).replace(".", ",")}° ${i.lat < 0 ? "S" : "N"}, ${Math.abs(i.lon).toFixed(1).replace(".", ",")}° ${i.lon < 0 ? "O" : "L"}`]],
    lancamentos: () => [i.nome, [i.local, i.ts ? new Date(i.ts * 1000).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "", i.status]],
    avioes: () => [i.voo ? "Voo " + i.voo : "Avião", [i.pais, i.alt != null ? `${Math.round(i.alt)} m` : "", VEL(i.vel)]],
  }[e.camada];
  if (!linhas) { c.hidden = true; return; }
  const [t, d] = linhas();
  c.replaceChildren(el("b", { text: t }), el("span", { text: d.filter(Boolean).join(" · ") }));
  c.hidden = false;
});

/* ---- busca, zoom, girar ---- */
const CIDADES = { "Brasil": [-14, -52, 1.6], "São Paulo": [-23.55, -46.63, 4], "Rio de Janeiro": [-22.91, -43.17, 4], "Brasília": [-15.79, -47.88, 4], "Salvador": [-12.97, -38.5, 4], "Fortaleza": [-3.73, -38.52, 4], "Belo Horizonte": [-19.92, -43.94, 4], "Manaus": [-3.12, -60.02, 4], "Curitiba": [-25.43, -49.27, 4], "Recife": [-8.05, -34.88, 4], "Porto Alegre": [-30.03, -51.23, 4], "Belém": [-1.46, -48.5, 4], "Goiânia": [-16.69, -49.26, 4], "São Luís": [-2.53, -44.3, 4], "Maceió": [-9.65, -35.73, 4], "Natal": [-5.79, -35.21, 4], "Teresina": [-5.09, -42.8, 4], "Campo Grande": [-20.45, -54.62, 4], "João Pessoa": [-7.12, -34.86, 4], "Aracaju": [-10.91, -37.07, 4], "Cuiabá": [-15.6, -56.1, 4], "Florianópolis": [-27.6, -48.55, 4], "Porto Velho": [-8.76, -63.9, 4], "Macapá": [0.03, -51.07, 4], "Vitória": [-20.32, -40.34, 4], "Rio Branco": [-9.97, -67.81, 4], "Boa Vista": [2.82, -60.67, 4], "Palmas": [-10.18, -48.33, 4], "Campinas": [-22.91, -47.06, 4.5], "Buenos Aires": [-34.6, -58.38, 3.5], "Santiago": [-33.45, -70.67, 3.5], "Lima": [-12.05, -77.04, 3.5], "Bogotá": [4.71, -74.07, 3.5], "Cidade do México": [19.43, -99.13, 3.5], "Nova York": [40.71, -74.01, 3.5], "Los Angeles": [34.05, -118.24, 3.5], "Miami": [25.76, -80.19, 3.5], "Cabo Canaveral": [28.4, -80.6, 4], "Lisboa": [38.72, -9.14, 3.5], "Madri": [40.42, -3.7, 3.5], "Londres": [51.51, -0.13, 3.5], "Paris": [48.86, 2.35, 3.5], "Berlim": [52.52, 13.4, 3.5], "Roma": [41.9, 12.5, 3.5], "Moscou": [55.75, 37.62, 3.5], "Istambul": [41.01, 28.98, 3.5], "Cairo": [30.04, 31.24, 3.5], "Lagos": [6.52, 3.38, 3.5], "Joanesburgo": [-26.2, 28.05, 3.5], "Dubai": [25.2, 55.27, 3.5], "Mumbai": [19.08, 72.88, 3.5], "Pequim": [39.9, 116.4, 3.5], "Xangai": [31.23, 121.47, 3.5], "Tóquio": [35.68, 139.69, 3.5], "Seul": [37.57, 126.98, 3.5], "Sydney": [-33.87, 151.21, 3.5], "Jacarta": [-6.21, 106.85, 3.5] };
$("cidades").replaceChildren(...Object.keys(CIDADES).map((c) => el("option", { value: c })));
const sem = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
$("busca").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const q = $("q").value.trim(); if (!q) return;
  const m = /^\s*(-?\d+(?:[.,]\d+)?)\s*[,; ]\s*(-?\d+(?:[.,]\d+)?)\s*$/.exec(q);
  const nome = Object.keys(CIDADES).find((c) => sem(c) === sem(q)) || Object.keys(CIDADES).find((c) => sem(c).startsWith(sem(q)));
  const c = $("cartao"), aviso = $("busca-msg");
  aviso.hidden = true;
  if (m) { const la = parseFloat(m[1].replace(",", ".")), lo = parseFloat(m[2].replace(",", ".")); if (Math.abs(la) <= 90 && Math.abs(lo) <= 180) { olho.irPara(la, lo, 3.5); c.hidden = true; return; } }
  if (nome) { const [la, lo, z] = CIDADES[nome]; olho.irPara(la, lo, z); c.hidden = true; if ($("lado").classList.contains("aberta")) $("abrir-camadas").click(); return; }
  // a resposta fica colada no campo (com a folha de camadas aberta no celular o cartão de baixo some)
  aviso.textContent = `Não achei "${q}". A busca conhece as capitais do Brasil e as maiores cidades do mundo. Também aceita latitude e longitude, por exemplo -23.5, -46.6.`;
  aviso.hidden = false; c.hidden = true;
});
$("mais").addEventListener("click", () => olho.zoom(1.35));
$("menos").addEventListener("click", () => olho.zoom(1 / 1.35));
$("brasil").addEventListener("click", () => olho.irPara(-14, -52, 1.6));
function pintarGirar() { $("girar").setAttribute("aria-pressed", String(pref.girar)); $("girar").textContent = pref.girar ? "Girando" : "Parado"; $("girar").setAttribute("aria-label", pref.girar ? "Parar de girar sozinho" : "Voltar a girar sozinho"); }
$("girar").addEventListener("click", () => { pref.girar = !pref.girar; olho.auto(pref.girar); guarda.gravar("olho-pref", pref); pintarGirar(); });
pintarGirar();
$("abrir-camadas").addEventListener("click", () => { const on = $("lado").classList.toggle("aberta"); document.body.classList.toggle("camadas-abertas", on); $("abrir-camadas").setAttribute("aria-expanded", String(on)); $("abrir-camadas").textContent = on ? "Fechar" : "Camadas"; $("abrir-camadas").setAttribute("aria-label", on ? "Fechar as camadas" : "Abrir as camadas"); });
$("globo").addEventListener("keydown", (ev) => { const c = olho.centro(), p = 8 / c.zoom; const k = { ArrowLeft: [0, -p], ArrowRight: [0, p], ArrowUp: [p, 0], ArrowDown: [-p, 0] }[ev.key]; if (k) { ev.preventDefault(); olho.irPara(c.lat + k[0], c.lon + k[1], c.zoom); } else if (ev.key === "+" || ev.key === "=") olho.zoom(1.25); else if (ev.key === "-") olho.zoom(0.8); });
document.addEventListener("visibilitychange", () => { if (document.hidden) olho.parar(); else olho.ligar(); });
desenharCamadas();
olho.ligar();
})();
</script>
</body>
</html>
