body.leve::after{display:none}
.olheiro{margin:0 0 4px;font:400 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--lavanda)}
.olheiro i{display:inline-block;width:8px;height:8px;background:var(--ciano);margin-right:8px;vertical-align:0}
body.tv .olheiro{font-size:28px}
body.tv .olheiro i{width:16px;height:16px}
#aviso.quebrou,#chip.quebrou{border-left:3px solid var(--roxo);color:var(--verde)}
/* 10/11 (leitura do dono): sem o PC a tela tem que mudar do sofá: o globo apaga e a linha de cima vira o aviso */
body.sem-contato #globo{opacity:.35}
body.com-tela #globo{visibility:hidden}      /* 10/11: com câmera ou parede aberta o mapa não vaza em volta da ficha */
#quando.quebrou{color:var(--giz);border-left:3px solid var(--roxo);box-shadow:inset 3px 0 0 var(--verde);padding-left:12px;font-weight:600}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
#palco{position:fixed;inset:0}
#globo{display:block;width:100%;height:100%;cursor:grab}
#globo:focus-visible{outline:3px solid var(--giz);outline-offset:-3px}

/* ---- topo: título, onde ele está (mundo › país › cidade) e a hora do dado ---- */
.topo{position:fixed;left:max(20px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));max-width:min(560px,calc(100% - var(--lado) - 64px));
  background:var(--placa);padding:8px 12px 10px;margin:-8px 0 0 -12px;width:max-content}
h1{font:400 44px/0.95 var(--display);letter-spacing:.04em;margin:0}
.trilha{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 0;padding:0;list-style:none;font:600 15px var(--body)}
.trilha li{display:flex;align-items:center;gap:6px}
.trilha li + li::before{content:"›";color:var(--lavanda)}
.trilha button{min-height:36px;padding:0 10px;background:none;border:2px solid var(--borda);cursor:pointer;font-weight:600}
.trilha span{padding:0 2px}
#quando{margin:6px 0 0;color:var(--lavanda);font-size:14px}

/* ---- botões: três estilos e só (principal, secundário, texto) ---- */
.bt{min-height:44px;min-width:44px;padding:0 16px;background:var(--placa);border:2px solid var(--borda);color:var(--giz);font:700 14px var(--body);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.bt.principal{background:var(--parede);border-color:var(--giz);color:var(--giz)}      /* 10/11: sem branco chapado, que gritava mais que a ficha */
.bt[aria-pressed="true"]{border-color:var(--ciano);color:var(--ciano)}
.bt:focus-visible,input:focus-visible{outline:3px solid var(--giz);outline-offset:3px}
@media (hover:hover){ .bt:hover,.trilha button:hover{border-color:var(--giz)} }

/* ---- lado: busca, ficha do país e camadas ---- */
.lado{position:fixed;right:max(20px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));bottom:max(16px,env(safe-area-inset-bottom));width:calc(var(--lado) - 40px);
  display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:12px}
.busca{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.busca input{min-height:44px;padding:0 12px;background:var(--placa);border:2px solid var(--borda);font-size:16px;width:100%}
.busca input::placeholder{color:var(--lavanda)}
#busca-msg{grid-column:1 / -1;margin:0;padding:8px 10px;background:var(--placa);border-left:3px solid var(--ambar);font-size:14px}
.abas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.conteudo{overflow:auto;background:var(--placa);border-left:2px solid var(--fio);padding:4px 4px 16px 16px;overscroll-behavior:contain}
.conteudo h2{font:400 32px/1 var(--display);letter-spacing:.04em;margin:10px 0 2px}
.conteudo h3{font:600 13px var(--body);letter-spacing:.08em;color:var(--lavanda);margin:18px 0 6px;text-transform:uppercase}

/* camadas */
.grupo{display:grid;gap:4px}
.cam{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;min-height:44px;padding:0 10px;background:none;border:0;border-left:3px solid transparent;
  text-align:left;cursor:pointer;color:var(--lavanda);width:100%}
.cam b{font:600 15px var(--body)}
.cam span{font:600 14px var(--mono);font-variant-numeric:tabular-nums}
.cam svg{width:18px;height:18px;display:block;color:var(--c);flex:none}
.cam[aria-pressed="true"]{color:var(--giz);border-left-color:var(--giz)}
.cam[aria-pressed="false"] svg{color:var(--lavanda);opacity:.5}
.cam:focus-visible{outline:3px solid var(--giz);outline-offset:-3px}
.cam small{grid-column:2 / -1;font-size:12px;color:var(--ambar);margin-top:-8px;padding-bottom:6px}
.regua{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--lavanda);padding:0 0 4px 13px}
.regua > span:first-child{flex-basis:100%}
.regua span{display:inline-flex;align-items:center;gap:5px}
.regua i{width:10px;height:10px;border-radius:50%;border:2px solid var(--c)}

/* ficha do país */
.ficha .hora{font:400 56px/1 var(--display);letter-spacing:.02em;margin:6px 0 0;font-variant-numeric:tabular-nums}
.ficha .sub{color:var(--lavanda);margin:2px 0 0}
.ficha .clima{display:flex;align-items:baseline;gap:10px;margin:10px 0 0}
.ficha .clima b{font:400 40px/1 var(--display)}
.linhas{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.linhas li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:start}
.linhas li svg{width:18px;height:18px;margin-top:2px;color:var(--c,var(--ciano))}
.linhas .nada{color:var(--lavanda);grid-template-columns:1fr}
.manchete{display:block;padding:6px 0 8px;border-bottom:1px solid var(--fio)}
.manchete:last-child{border-bottom:0}
.manchete small{display:block;color:var(--lavanda);font-size:12px;margin-top:2px}
.cambio{font:400 30px/1.1 var(--display);margin:0}
.ficha p{margin-top:0}
.fontes{margin:18px 0 0;font:400 12px/1.4 var(--mono);color:var(--lavanda)}
.lista-cams{display:grid;gap:6px}
.lista-cams .bt{justify-content:space-between;width:100%;padding:8px 12px;font-weight:600;white-space:normal;text-align:left;line-height:1.25}
.lista-cams{align-content:start}
.grupo{align-content:start}
.lista-cams .bt small{color:var(--lavanda);font-weight:400}
.bt.principal small,.lista-cams .bt.principal small{color:var(--lavanda)}
.aviso-ficha{margin:8px 0 0;padding:8px 10px;border-left:3px solid var(--ambar);color:var(--giz)}
.esqueleto{color:var(--lavanda)}

/* ---- pé: cartão do ponto tocado e os botões ---- */
.pe{position:fixed;left:max(20px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));right:calc(var(--lado) + 8px);display:grid;gap:10px;justify-items:start;pointer-events:none}
.pe > *{pointer-events:auto}
.acoes{display:flex;flex-wrap:wrap;gap:8px}
#cartao{max-width:460px;background:var(--placa);border-left:3px solid var(--ciano);padding:10px 14px}
#cartao b{display:block;font:600 16px/1.3 var(--body)}
#cartao span{display:block;color:var(--lavanda);font-size:14px}
#cartao .bt{margin-top:8px}
#foco{max-width:560px;background:var(--placa);border-left:3px solid var(--ciano);padding:10px 14px;margin:0;font:600 16px/1.35 var(--body)}
#foco small{display:block;font:400 13px var(--mono);color:var(--lavanda);margin-bottom:4px;letter-spacing:.06em;text-transform:uppercase}
#chip{position:fixed;right:calc(var(--lado) + 8px);bottom:max(16px,env(safe-area-inset-bottom));font:400 12px var(--mono);color:var(--lavanda);background:var(--placa);padding:6px 10px;border:1px solid var(--fio)}
#aviso{position:fixed;left:calc((100% - var(--lado)) / 2);top:50%;transform:translate(-50%,-50%);max-width:min(440px,calc(100% - 40px));background:var(--placa);border-left:3px solid var(--ambar);padding:14px 16px;margin:0}
#aviso.quebrou{border-left-color:var(--roxo)}

/* ---- câmera e parede: cobrem o espaço do globo, não o lado ---- */
.tela{position:fixed;left:0;top:0;bottom:0;right:var(--lado);background:var(--tinta);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding:20px 24px 16px;
  animation:entrou .28s var(--curva)}
@keyframes entrou{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.tela header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.tela h2{font:400 36px/1 var(--display);letter-spacing:.03em;margin:0}
.tela header p{margin:4px 0 0;color:var(--lavanda)}
.quadro{position:relative;background:#000;border:2px solid var(--fio);min-height:0;display:grid;place-items:center;overflow:hidden}
.quadro::before,.quadro::after{content:"";position:absolute;width:12px;height:12px;border-color:var(--ciano);border-style:solid;z-index:2;pointer-events:none}
.quadro::before{left:-2px;top:-2px;border-width:2px 0 0 2px}
.quadro::after{right:-2px;bottom:-2px;border-width:0 2px 2px 0}
.quadro img,.quadro iframe,.quadro video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border:0;display:block}
.quadro .vivo{position:absolute;left:10px;bottom:10px;font:400 12px var(--mono);background:var(--placa);padding:3px 8px;color:var(--giz);letter-spacing:.08em;z-index:1}
.quadro .vivo i{display:inline-block;width:8px;height:8px;background:var(--ciano);margin-right:6px;vertical-align:1px}
.ao-vivo{display:inline-flex;align-items:center;gap:6px;font:400 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--giz);margin-right:10px;vertical-align:1px}
.ao-vivo i{width:8px;height:8px;background:var(--ciano);display:inline-block}
body.tv .ao-vivo{font-size:28px}
body.tv .ao-vivo i{width:16px;height:16px}
.grade-cams .quadro img{object-fit:cover}
.grade-cams .quadro .vivo{top:8px;bottom:auto}
.quadro .fora{color:var(--lavanda);padding:20px;text-align:center}
.tela footer{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px}
.tela footer .acoes{flex-wrap:wrap}
.tela footer small{font:400 12px var(--mono);color:var(--lavanda);max-width:60ch}
.grade-cams{display:grid;grid-template-columns:repeat(var(--colunas,3),minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:10px;min-height:0}
.grade-cams .quadro{cursor:pointer}
.grade-cams .rotulo{position:absolute;left:0;right:0;bottom:0;background:var(--placa);padding:6px 10px;font:600 14px var(--body);z-index:1;text-align:left}
.grade-cams .rotulo small{font:400 12px var(--mono);color:var(--lavanda);margin-left:6px}

/* ---- celular: o lado vira folha que sobe de baixo ---- */
#abrir-lado{display:none}
@media (max-width:820px){
  :root{--lado:0px}
  h1{font-size:34px}
  .topo{max-width:calc(100% - 32px)}
  .trilha button{min-height:44px}
  .lado{left:0;right:0;width:auto;top:auto;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 64px);max-height:52dvh;gap:8px;background:var(--tinta);border-top:2px solid var(--giz);padding:12px 16px 0;
    grid-template-rows:auto auto minmax(0,1fr)}
  body:not(.lado-aberto) .lado{display:none}
  .conteudo{border-left:0;background:none;padding:0 0 24px}
  .busca input{background:var(--parede)}
  .pe{right:16px;left:16px}
  .acoes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:440px}
  .acoes .bt{padding:0 6px;min-width:0}
  #abrir-lado{display:inline-flex}
  .zoom-bt{position:fixed;right:max(16px,env(safe-area-inset-right));width:44px;padding:0;background:var(--tinta)}
  #mais{bottom:calc(max(16px,env(safe-area-inset-bottom)) + 116px)}
  #menos{bottom:calc(max(16px,env(safe-area-inset-bottom)) + 64px)}
  body.lado-aberto .zoom-bt,body.lado-aberto #cartao,body.lado-aberto #foco,body.lado-aberto #quando,body.lado-aberto #chip{display:none}
  #cartao,#foco{margin-right:60px}
  #chip{right:16px;bottom:auto;top:max(16px,env(safe-area-inset-top))}
  #aviso{left:50%}
  .tela{right:0;padding:12px 12px calc(max(12px,env(safe-area-inset-bottom)) + 8px)}
  .tela h2{font-size:28px}
  .grade-cams{--colunas:2!important}
}
@media (min-width:600px) and (max-width:820px){ .acoes{display:flex;max-width:none} .acoes .bt{padding:0 18px} }
/* 10/11: com o "Tirar da TV" são quatro botões; no celular ficam 2 por 2, e o zoom e o painel sobem uma linha */
@media (max-width:599px){
  .pe .acoes{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* com a ficha aberta ela desce até o fim da tela: a faixa dos botões fica opaca pra o texto não aparecer por trás */
  body.lado-aberto .pe .bt{background:var(--tinta)}
  body.lado-aberto .pe .acoes{background:var(--tinta);box-shadow:0 0 0 16px var(--tinta),0 24px 0 16px var(--tinta)}
  .tela-unica .tela{grid-template-rows:auto auto auto;align-content:center}      /* a câmera no meio da tela, sem meia tela vazia embaixo */
  .tela-unica .tela > .quadro{aspect-ratio:var(--ar,4 / 3);height:auto}
  .lado{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 116px)}
  .conteudo{-webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent);mask-image:linear-gradient(#000 calc(100% - 28px),transparent)}
  #mais{bottom:calc(max(16px,env(safe-area-inset-bottom)) + 168px)}
  #menos{bottom:calc(max(16px,env(safe-area-inset-bottom)) + 116px)}
}
@media (max-width:360px){ .acoes{gap:6px} .acoes .bt{font-size:13px;padding:0 4px} h1{font-size:30px} }

/* ---- TV (?tv=1): 1920x1080, lida do sofá, sem mouse. Nada abaixo de 28 px. ---- */
body.tv{--lado:600px;width:1920px;height:1080px;font-size:30px}
body.tv .topo{left:48px;top:44px;max-width:640px;padding:12px 18px 14px}
body.tv h1{font-size:88px}
body.tv .trilha{font-size:36px;margin-top:12px}
body.tv .trilha span{padding:0}
body.tv #quando{font-size:28px}
body.tv .lado{right:48px;top:48px;bottom:48px;width:520px;grid-template-rows:minmax(0,1fr)}
body.tv .busca,body.tv .abas,body.tv .acoes,body.tv .zoom-bt{display:none!important}
body.tv .conteudo{overflow:hidden;padding:8px 8px 16px 24px;border-left-width:4px}
body.tv .conteudo h2{font-size:64px;margin-top:4px}
body.tv .conteudo h3{font-size:28px;margin:24px 0 8px}
body.tv .ficha .hora{font-size:96px}
body.tv .ficha .sub,body.tv .linhas li,body.tv .manchete{font-size:30px}
body.tv .linhas li{grid-template-columns:30px minmax(0,1fr)}
body.tv .linhas li svg{width:30px;height:30px}
body.tv .linhas li.nada{grid-template-columns:1fr}
body.tv .tela{right:568px}
body.tv .ficha .clima b{font-size:64px}
body.tv .manchete small,body.tv .fontes{font-size:28px}
body.tv .cambio{font-size:48px}
body.tv .lista-cams,body.tv .so-toque{display:none}
body.tv .cam{min-height:60px;font-size:30px;cursor:default}
body.tv .cam b{font:400 36px var(--display)}
body.tv .cam span{font-size:32px}
body.tv .cam svg{width:30px;height:30px}
body.tv .regua{display:none}
body.tv .pe{left:48px;bottom:44px;right:648px}
body.tv #foco{font-size:34px;max-width:1100px;padding:16px 22px;border-left-width:6px}
body.tv #foco small{font-size:28px}
body.tv #cartao{display:none!important}
body.tv #chip{font-size:28px;right:648px;bottom:44px}
body.tv #chip:not(.quebrou){display:none!important}      /* 10/11: "modo leve" não diz nada pra quem está no sofá */
body.tv .tela{padding:44px 48px 40px}
body.tv .tela h2{font-size:72px}
body.tv .tela header p,body.tv .tela footer small{font-size:30px}
body.tv .grade-cams .rotulo{font-size:30px}
body.tv .grade-cams .rotulo small{font-size:28px}
body.tv .quadro .vivo{font-size:28px}
body.tv .dica{display:block}
.dica{display:none;margin:20px 0 0;font:400 30px/1.2 var(--display);color:var(--lavanda)}
body.embutido h1{font-size:34px}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
body.leve .tela{animation:none}
</style>

<body>
<div id="palco"><canvas id="globo" tabindex="0" role="img" aria-label="Globo da Terra. Arraste pra girar, use a roda ou a pinça pra aproximar, toque num país pra abrir a ficha dele."></canvas></div>
<header class="topo">
  <p class="olheiro"><i></i>Oráculo · sala de monitores</p>
  <h1>Olho de Deus</h1>
  <ol class="trilha" id="trilha" aria-label="Onde você está"></ol>
  <p id="quando">Carregando o dado do mundo…</p>
</header>
<aside class="lado" id="lado" aria-label="Busca, ficha do país e camadas">
  <form class="busca" id="busca" autocomplete="off">
    <input id="q" list="lugares" placeholder="País, cidade ou lat, lon" aria-label="Buscar país, cidade, ou latitude e longitude">
    <button class="bt" type="submit">Ir</button>
    <datalist id="lugares"></datalist>
    <p id="busca-msg" role="status" hidden></p>
  </form>
  <div class="abas" id="abas" role="group" aria-label="O que mostrar ao lado" hidden>
    <button class="bt" type="button" id="aba-ficha" aria-pressed="true">Ficha</button>
    <button class="bt" type="button" id="aba-camadas" aria-pressed="false">Camadas</button>
  </div>
  <div class="conteudo" id="conteudo"></div>
</aside>
<div class="pe">
  <p id="foco" hidden role="status"></p>
  <div id="cartao" hidden role="status"></div>
  <div class="acoes">
    <button class="bt" type="button" id="abrir-lado" aria-expanded="false" aria-controls="lado">Camadas</button>
    <button class="bt zoom-bt" type="button" id="menos" aria-label="Afastar">−</button>
    <button class="bt zoom-bt" type="button" id="mais" aria-label="Aproximar">+</button>
    <button class="bt" type="button" id="ronda" aria-pressed="false">Ronda</button>
    <button class="bt" type="button" id="girar" aria-pressed="true">Girando</button>
    <button class="bt" type="button" id="fechar-tv">Tirar da TV</button>
  </div>
</div>
<p id="chip" hidden></p>
<p id="aviso" hidden role="status"></p>
<section class="tela" id="tela" hidden aria-live="polite"></section>
<script src="olho.js?v=33add54a4b"></script>
<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const P = new URLSearchParams(location.search);
const TV = P.get("tv") === "1", EMBUTIDO = P.get("embutido") === "1";
if (TV) document.body.classList.add("tv");
if (EMBUTIDO) document.body.classList.add("embutido");
const calmo = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let API = P.get("api") || "../olho/";          /* a Central serve /olho/*; a vitrine da TV repassa o mesmo caminho */
const guarda = { ler(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, gravar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

/* o espaço livre pro globo: tudo menos o lado (e, no celular, menos a folha aberta) */
function livre() {

  }

}
const olho = Olho.criar($("globo"), { paises: "paises-110m.json", paises50: "paises-50m.json", tiles: API + "tile/", auto: pref.girar,
  fps: 30, tv: TV, parado: calmo, leve: calmo || P.get("leve") === "1", livre, aoMexer: () => { mexeu(); } });
for (const id of pref.desligadas || []) olho.camada(id, false);
const COR = { terremotos: "#f3e2b8", queimadas: "#d99a3a", eventos: "#eef2f8", satelites: "#c9d3e6", lancamentos: "#38d6ff", avioes: "#9aa6bd", cameras: "#38d6ff" };
let D = null, falhas = 0, LUG = { paises: [], cidades: [] }, CAMS = [], PAIS = {}, NUM = {};
let estado = { pais: null, cidade: null, ficha: null, aba: "camadas", tela: null, ronda: false };
const hora = (ts) => ts ? new Date(ts * 1000).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "";
const ha = (ts) => { if (!ts) return ""; const s = Math.max(0, Date.now() / 1000 - ts); return s < 3600 ? `há ${Math.max(1, Math.round(s / 60))} min` : s < 86400 ? `há ${Math.round(s / 3600)} h` : `há ${Math.round(s / 86400)} d`; };
const virg = (x, c = 0) => x == null ? "" : Number(x).toFixed(c).replace(".", ",");
const sem = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const el = (tag, at = {}, ...f) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(at)) { if (v == null || v === false) continue; if (k === "text") e.textContent = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v); } for (const x of f.flat(4)) if (x != null) e.append(x); return e; };

/* a marca de cada camada na legenda e na ficha é a mesma forma que o globo desenha */
const FORMAS = { terremotos: '<circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/>',
  queimadas: '<rect x="3" y="3" width="4" height="4" fill="currentColor"/><rect x="10" y="6" width="4" height="4" fill="currentColor"/><rect x="5" y="11" width="4" height="4" fill="currentColor"/>',
  eventos: '<path d="M9 3a6 6 0 0 1 5.6 3.9M9 15a6 6 0 0 1-5.6-3.9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="9" r="1.8" fill="currentColor"/><path d="M14 16h-5l2.5-4z" fill="none" stroke="currentColor" stroke-width="1.6"/>',
  satelites: '<path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="2"/>',
  lancamentos: '<path d="M9 16V7" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="5" r="3" fill="currentColor"/>',
  avioes: '<path d="M4 14 14 4" stroke="currentColor" stroke-width="2.4"/>',
  cameras: '<rect x="3" y="3" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"/><rect x="7" y="7" width="4" height="4" fill="currentColor"/>',
  hora: '<circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 5v4l3 2" fill="none" stroke="currentColor" stroke-width="2"/>' };
function forma(id, cor) { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 18 18"); s.setAttribute("aria-hidden", "true"); s.innerHTML = FORMAS[id] || ""; if (cor) s.style.color = cor; return s; }

/* ---------------- a trilha: Mundo › País › Cidade ---------------- */
function pintarTrilha() {
  const t = $("trilha"), itens = [];
  const voltar = !TV && (estado.pais || estado.cidade);
  itens.push(el("li", {}, voltar ? el("button", { type: "button", text: "Mundo", onclick: () => mundo(), "aria-label": "Voltar pro mundo" }) : el("span", { text: "Mundo" })));
  if (estado.pais) itens.push(el("li", {}, estado.cidade && !TV ? el("button", { type: "button", text: estado.pais.nome, onclick: () => irPais(estado.pais.iso) }) : el("span", { text: estado.pais.nome })));
  if (estado.cidade) itens.push(el("li", {}, el("span", { text: estado.cidade.nome })));
  t.replaceChildren(...itens);
}

/* ---------------- lado: camadas ---------------- */
function painelCamadas() {
  const lig = olho.ligadas(), c = olho.contagens(), fontes = (D && D.fontes) || {};
  const noMapa = Olho.CAMADAS.filter((k) => lig[k.id]).length;
  const grupos = [...new Set(Olho.CAMADAS.map((k) => k.grupo))];
  return [el("h2", { text: "Camadas" }), el("p", { style: "margin:0;color:var(--lavanda);font-size:13px", class: "so-toque", text: `${noMapa} de ${Olho.CAMADAS.length} no mapa` }),
    ...grupos.map((g) => el("div", { class: "grupo" }, el("h3", { text: g }),
      Olho.CAMADAS.filter((k) => k.grupo === g).map((k) => {
        const f = fontes[k.id] || {}, velho = D && f.em && (!f.ok || Date.now() / 1000 - f.em > (k.id === "satelites" ? 8 : 3) * 3600);      /* satélite renova de 6 em 6 h */
        const b = el("button", { type: "button", class: "cam", "aria-pressed": String(!!lig[k.id]), style: `--c:${COR[k.id]}`, "aria-label": `${k.nome}, ${c[k.id] || 0}. ${lig[k.id] ? "Desligar" : "Ligar"}` },
          forma(k.id), el("b", { text: k.nome }), el("span", { text: D || k.id === "cameras" ? String(c[k.id] || 0) : "" }),
          velho ? el("small", { text: `dado das ${hora(f.em)}: a fonte não respondeu depois` }) : (D && !f.em && k.id !== "cameras" ? el("small", { text: "a fonte ainda não respondeu" }) : null));
        b.addEventListener("click", () => ligarCamada(k.id, !olho.ligadas()[k.id]));
        return k.id === "terremotos" ? [b, el("div", { class: "regua", "aria-label": "Cor do terremoto pela magnitude" }, el("span", { text: "magnitude" }), [["menos de 4", 3], ["4 a 5", 4], ["5 a 6", 5], ["6 ou mais", 6]].map(([t, m]) => el("span", {}, el("i", { style: `--c:${Olho.corMag(m)}` }), t)))] : b;
      }))),
    TV ? el("p", { class: "dica", text: "diga “zoom no Japão” ou “câmeras de Tóquio”" }) : null];
}
function ligarCamada(id, on) {
  olho.camada(id, on);
  if (!TV) { pref.desligadas = Olho.CAMADAS.filter((x) => !olho.ligadas()[x.id]).map((x) => x.id); guarda.gravar("olho-pref", pref); }
  pintarLado();
}

/* ---------------- lado: a ficha do país ---------------- */
const MOEDA = { USD: ["dólar", "dólares"], EUR: ["euro", "euros"], GBP: ["libra", "libras"], JPY: ["iene", "ienes"], CNY: ["yuan", "yuans"], ARS: ["peso argentino", "pesos argentinos"],
  CLP: ["peso chileno", "pesos chilenos"], MXN: ["peso mexicano", "pesos mexicanos"], CAD: ["dólar canadense", "dólares canadenses"], AUD: ["dólar australiano", "dólares australianos"],
  CHF: ["franco suíço", "francos suíços"], KRW: ["won", "wons"], INR: ["rúpia", "rúpias"], RUB: ["rublo", "rublos"], ZAR: ["rand", "rands"], COP: ["peso colombiano", "pesos colombianos"],
  PEN: ["sol", "soles"], UYU: ["peso uruguaio", "pesos uruguaios"], PYG: ["guarani", "guaranis"], BOB: ["boliviano", "bolivianos"], TRY: ["lira turca", "liras turcas"],
  AED: ["dirham", "dirhams"], SAR: ["rial", "riais"], ILS: ["shekel", "shekels"], EGP: ["libra egípcia", "libras egípcias"], NGN: ["naira", "nairas"], SEK: ["coroa sueca", "coroas suecas"],
  NOK: ["coroa norueguesa", "coroas norueguesas"], DKK: ["coroa dinamarquesa", "coroas dinamarquesas"], PLN: ["zloty", "zlotys"], CZK: ["coroa tcheca", "coroas tchecas"],
  HUF: ["florim", "florins"], SGD: ["dólar de Singapura", "dólares de Singapura"], HKD: ["dólar de Hong Kong", "dólares de Hong Kong"], TWD: ["dólar taiwanês", "dólares taiwaneses"],
  THB: ["baht", "bahts"], IDR: ["rupia", "rupias"], VND: ["dong", "dongs"], PHP: ["peso filipino", "pesos filipinos"], NZD: ["dólar neozelandês", "dólares neozelandeses"],
  ISK: ["coroa islandesa", "coroas islandesas"], UAH: ["grívnia", "grívnias"], VES: ["bolívar", "bolívares"], CUP: ["peso cubano", "pesos cubanos"] };
function cambioTexto(c) {
  if (!c) return null;
  if (c.mesma) return null;      /* 10/11: no Brasil não tem câmbio a mostrar */
  const nomes = MOEDA[c.moeda] || [c.moeda, c.moeda];
  for (const q of [1, 10, 100, 1000, 10000]) { const v = c.brl * q; if (v >= 0.5 || q === 10000) return `${q.toLocaleString("pt-BR")} ${q === 1 ? nomes[0] : nomes[1]} = R$ ${v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`; }
}
function horaLocal(f) { const d = new Date(Date.now() + f.hora.utc_s * 1000), z = (n) => String(n).padStart(2, "0"); return `${z(d.getUTCHours())}:${z(d.getUTCMinutes())}`; }
function painelFicha() {
  const f = estado.ficha, p = estado.pais;

    const j = await r.json(); semContato = 0;
    if (cmdId === null) { cmdId = j.id; if (j.cmd && j.agora - j.em < 8) obedecer(j.cmd); return; }      /* comando falado logo antes de abrir a página vale */
    if (j.id > cmdId) { cmdId = j.id; if (j.cmd) obedecer(j.cmd); }
  } catch (e) { semContato++; }
}
setInterval(perguntarComando, 1000);

/* ---------------- dado do mundo ---------------- */
/* 10/11 (leitura do dono): no país e na cidade a linha de cima diz a hora de lá; no mundo, a hora do dado */
var quandoMundo = "";      // var: o pintarLado chama antes desta linha rodar
function pintarQuando() {
  const f = estado.ficha, lugar = estado.cidade ? estado.cidade.nome : f && f.nome;
  if (!quandoMundo) return;
  $("quando").textContent = estado.pais && f && lugar && !document.body.classList.contains("sem-contato") ? `${horaLocal(f)} lá · ${quandoMundo.replace("Dado público do mundo · ", "dado das ")}` : quandoMundo;
}
function receber(d) {
  D = d; olho.dados(d); falhas = 0; document.body.classList.remove("sem-contato"); $("quando").classList.remove("quebrou");
  $("aviso").hidden = true;
  const velho = d.atualizado && Date.now() / 1000 - d.atualizado > 1800;
  quandoMundo = d.atualizado ? `Dado público do mundo · ${hora(d.atualizado)}${velho ? " · o coletor do PC parou, este é o último dado" : ""}` : "O coletor do PC ainda não trouxe nada.";
  pintarQuando();
  pintarLado();
}
function avisar(txt, quebrou) { $("aviso").textContent = txt; $("aviso").classList.toggle("quebrou", !!quebrou); $("aviso").hidden = false; }
const fonte = () => P.get("dados") && P.get("dados") !== "mensagem" ? P.get("dados") : API + "dados";
async function buscar() {
  if (P.get("dados") === "mensagem") return;
  try {
    const r = await fetch(fonte(), { cache: "no-store" });
    if (r.status === 503) { if (!D) avisar("O coletor do PC ainda não rodou. Em um minuto o dado aparece sozinho."); return; }
    if (!r.ok) throw new Error("http " + r.status);
    receber(await r.json());
  } catch (e) {
    if (++falhas >= 2 || !D) { if (D) pintarSemPC(); else avisar("Sem contato com o PC. O globo aparece assim que ele responder; tento de novo sozinho.", true); }
  }
}
addEventListener("message", (ev) => { if (ev.origin === location.origin && ev.data && ev.data.olho) receber(ev.data.olho); else if (ev.origin === location.origin && ev.data && ev.data.olhoAviso) avisar(ev.data.olhoAviso); });
if (P.get("dados") === "mensagem") { $("quando").textContent = "Esperando o dado da Central…"; parent.postMessage({ olhoPronto: true }, location.origin); }
buscar(); setInterval(() => { if (!document.hidden) buscar(); }, 60000);
async function buscarBase() {
  try {
    const [l, c] = await Promise.all([fetch(API + "lugares").then((r) => r.json()), fetch(API + "cameras").then((r) => r.json())]);
    LUG = l; CAMS = c.cameras || []; PAIS = {}; NUM = {};
    for (const p of LUG.paises) { PAIS[p[0]] = p; if (p[5]) NUM[p[5]] = p[0]; }
    olho.cameras(CAMS);
    $("lugares").replaceChildren(...[...LUG.paises.map((p) => p[1]), ...[...new Set(CAMS.map((x) => x.cidade))], ...LUG.cidades.slice(0, 150).map((c) => c[0])].filter((v, i, a) => a.indexOf(v) === i).map((n) => el("option", { value: n })));
    pintarLado();
  } catch (e) { setTimeout(buscarBase, 15000); }
}
buscarBase();

/* ---------------- tocar num ponto ---------------- */
const VEL = (v) => v == null ? "" : `${Math.round(v * 3.6)} km/h`;
olho.aoEscolher((e) => {
  mexeu();
  const c = $("cartao");
  if (!e) { c.hidden = true; return; }
  const i = e.item;
  if (e.camada === "cameras") { c.hidden = true; return abrirCamera(i.id, CAMS.filter((x) => x.cidade === i.cidade).map((x) => x.id)); }
  const linhas = {
    terremotos: () => [`Terremoto de magnitude ${virg(i.mag, 1)}`, [i.lugar, ha(i.ts), i.prof != null ? `${i.prof} km de profundidade` : ""]],
    eventos: () => [({ ciclone: "Ciclone", tempestade: "Tempestade", vulcao: "Vulcão", incendio: "Incêndio" }[i.tipo] || "Evento") + (i.nome ? ": " + i.nome : ""), [i.ts ? "visto " + ha(i.ts) : "", i.nivel ? "alerta " + i.nivel : ""]],
    satelites: () => [i.iss ? "Estação Espacial Internacional" : i.nome, [`${Math.round(i.alt)} km de altitude`, `sobre ${virg(Math.abs(i.lat), 1)}° ${i.lat < 0 ? "S" : "N"}, ${virg(Math.abs(i.lon), 1)}° ${i.lon < 0 ? "O" : "L"}`]],
    lancamentos: () => [i.nome, [i.local, i.ts ? new Date(i.ts * 1000).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "", i.status]],
    avioes: () => [i.voo ? "Voo " + i.voo : "Avião", [i.pais, i.alt != null ? `${Math.round(i.alt)} m` : "", VEL(i.vel)]],
  }[e.camada];
  if (!linhas) { c.hidden = true; return; }
  const [t, d] = linhas();
  c.replaceChildren(el("b", { text: t }), el("span", { text: d.filter(Boolean).join(" · ") }));
  c.hidden = false;
});

/* ---------------- busca, zoom, girar, folha do celular ---------------- */
$("busca").addEventListener("submit", (ev) => {
  ev.preventDefault(); mexeu();
  const q = $("q").value.trim(); if (!q) return;
  const aviso = $("busca-msg"); aviso.hidden = true; $("cartao").hidden = true;
  const m = /^\s*(-?\d+(?:[.,]\d+)?)\s*[,; ]\s*(-?\d+(?:[.,]\d+)?)\s*$/.exec(q);
  if (m) { const la = parseFloat(m[1].replace(",", ".")), lo = parseFloat(m[2].replace(",", ".")); if (Math.abs(la) <= 90 && Math.abs(lo) <= 180) { olho.voar(la, lo, 40); return; } }
  const s = sem(q);
  const pais = LUG.paises.find((p) => sem(p[1]) === s) || LUG.paises.find((p) => sem(p[0]) === s);
  const camCid = CAMS.find((x) => sem(x.cidade) === s);
  const cid = LUG.cidades.find((c) => sem(c[0]) === s);
  const pref2 = LUG.paises.find((p) => sem(p[1]).startsWith(s)) || LUG.cidades.find((c) => sem(c[0]).startsWith(s));
  if (pais) irPais(pais[0]);
  else if (camCid) irCidade(camCid.cidade, camCid.pais, camCid.lat, camCid.lon);
  else if (cid) irCidade(cid[0], cid[1], cid[2], cid[3]);
  else if (pref2) { if (pref2.length === 6) irPais(pref2[0]); else irCidade(pref2[0], pref2[1], pref2[2], pref2[3]); }
  else { aviso.textContent = `Não achei "${q}". A busca conhece todos os países, as cidades grandes e as das câmeras, e aceita latitude e longitude (por exemplo -23.5, -46.6).`; aviso.hidden = false; return; }
  $("q").value = "";
});
$("mais").addEventListener("click", () => { mexeu(); olho.zoom(1.6); });
$("menos").addEventListener("click", () => { mexeu(); olho.zoom(1 / 1.6); });
// rótulo da câmera de imagem: "FOTO · 5 MIN" cabe numa linha no celular (10/11)
/* 10/11 (leitura do dono): "FOTO · 1 MIN" prometia a idade da foto, e a fonte às vezes manda uma de 8 minutos atrás.
   O rótulo diz só o que é certo: é foto, não vídeo; a hora está carimbada na própria imagem */
/* 10/11 (leitura do dono): o crédito da câmera era a bula inteira da licença em três linhas. Fica o dono e a licença
   curta; a lista completa segue no cameras.json e na tela de fontes do PC */
const donoCurto = (c) => String(c.dono || c.fonte || "").replace(/^YouTube:\s*/i, "").replace(/\s*\([^)]*\)/g, "").trim();
function licencaCurta(l) {
  const m = String(l || "").match(/CC BY[\w .-]*?\d(\.\d)?|Open Government Licence v?[\d.]+|ODbL|domínio público/i);
  return m ? m[0].replace(/Open Government Licence v?/i, "OGL v") : "";
}
function creditoCam(c) { const l = licencaCurta(c.licenca); return "Imagem: " + donoCurto(c) + (l ? " · " + l : ""); }
function cadaQuanto() { return "FOTO DA FONTE"; }
/* 10/11 (leitura do dono): "Girando" aceso com o mapa parado na cidade parecia mentira. O globo só gira no mundo;
   fora dele o botão diz que vai girar quando voltar, sem aceso */
function pintarGirar() { const noMundo = olho.nivel() === "mundo", gira = pref.girar && noMundo;
  $("girar").setAttribute("aria-pressed", String(gira)); $("girar").textContent = !pref.girar ? "Parado" : noMundo ? "Girando" : "Gira no mundo";
  $("girar").setAttribute("aria-label", pref.girar ? "Parar de girar sozinho" : "Voltar a girar sozinho"); }
olho.aoNivel(() => { pintarGirar(); pintarQuando(); });
$("girar").addEventListener("click", () => { mexeu(); pref.girar = !pref.girar; olho.auto(pref.girar); guarda.gravar("olho-pref", pref); pintarGirar(); });
pintarGirar();
// 10/11 17h: tira o Olho da TV pelo mesmo comando da voz ("fecha o olho de Deus"), pelo Jarvis da Central
$("fechar-tv").addEventListener("click", async () => {
  const b = $("fechar-tv"); b.disabled = true; b.textContent = "Fechando…";
  let txt = "Não deu: o PC não respondeu";
  try {
    const r = await fetch("/jarvis/api/conversa", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texto: "fecha o olho de Deus", canal: "central", idioma: "pt", falar: false }) });
    const d = await r.json();
    if (r.ok && d.acao === "pagina_tv" && /fechado/i.test(d.fala_pt || d.fala || "")) txt = "Saiu da TV";
  } catch (e) {}
  b.textContent = txt;
  setTimeout(() => { b.textContent = "Tirar da TV"; b.disabled = false; }, 4000);
});
function abrirLado(on) { document.body.classList.toggle("lado-aberto", on); $("abrir-lado").setAttribute("aria-expanded", String(on)); pintarLado(); }
$("abrir-lado").addEventListener("click", () => { mexeu(); abrirLado(!document.body.classList.contains("lado-aberto")); });
$("globo").addEventListener("keydown", (ev) => { mexeu(); const c = olho.centro(), p = 8 / c.zoom; const k = { ArrowLeft: [0, -p], ArrowRight: [0, p], ArrowUp: [p, 0], ArrowDown: [-p, 0] }[ev.key]; if (k) { ev.preventDefault(); olho.voar(c.lat + k[0], c.lon + k[1], c.zoom); } else if (ev.key === "+" || ev.key === "=") olho.zoom(1.4); else if (ev.key === "-") olho.zoom(0.7); });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") { if (estado.tela) fecharTela(); else if (estado.pais) mundo(); } });
["pointerdown", "keydown", "wheel"].forEach((t) => document.addEventListener(t, () => mexeu(), { passive: true }));
document.addEventListener("visibilitychange", () => { if (document.hidden) olho.parar(); else olho.ligar(); });

/* ---------------- modo leve: abaixo de 24 quadros por segundo, liga sozinho ---------------- */
let baixos = 0, desde = Date.now();
function pintarChip() { const m = olho.medida(); $("chip").hidden = !m.leve; $("chip").textContent = "modo leve"; document.body.classList.toggle("leve", m.leve); }
setInterval(() => {
  if (document.hidden || Date.now() - desde < 4000) return;
  const m = olho.medida();
  if (!m.leve && m.fps && m.fps < 24) { if (++baixos >= 3) { olho.leve(true); pintarChip(); } } else baixos = 0;
}, 2000);
pintarChip();

/* pra conferência e pros testes: o estado da tela sem precisar olhar pixel */
window.__olho = { estado: () => ({ nivel: olho.nivel(), pais: estado.pais && estado.pais.iso, cidade: estado.cidade && estado.cidade.nome, ficha: !!estado.ficha,
  tela: estado.tela && estado.tela.tipo, ronda: estado.ronda, cmdId, voando: olho.voando(), medida: olho.medida(), semContato }),
  irPais, irCidade, mundo, abrirCamera, abrirParede, comecarRonda, obedecer, olho,
  /* conferência: simula o PC caindo depois de a página abrir (o caso real de sem rede) */
  async semRede() { API = "/sem-rede/"; await buscar(); await buscar(); for (let i = 0; i < 5; i++) await perguntarComando(); pintarRede(); } };

addEventListener("resize", () => pintarLado());
pintarLado();
olho.ligar();
})();
</script>
</body>
</html>
